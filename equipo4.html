<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Equipo 4 - Escítala Espartana</title>
</head>
<body>

    <h2>Escítala Espartana</h2>

    <!-- Entrada de mensaje -->
    <label for="mensaje">Mensaje:</label>
    <input type="text" id="mensaje" placeholder="Escribe tu mensaje aquí">

    <br><br>

    <!-- Entrada de la clave -->
    <label for="clave">Clave (columnas):</label>
    <input type="number" id="clave" min="1" placeholder="Ej. 4">

    <br><br>

    <!-- Botones con los IDs requeridos -->
    <button id="btnCifrar">Cifrar</button>
    <button id="btnDescifrar">Descifrar</button>

    <hr>

    <!-- Contenedor donde se dibuja la tabla y el resultado -->
    <div id="resultado"></div>

    <!-- Enlace al archivo JS -->
    <script src="script.js"></script>
</body>
</html>
