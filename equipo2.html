<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Equipo 2 - Vigenère</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <div class="contenedor">
    <h2>Equipo 2 - Método Vigenère</h2>

    <h3>Prueba del programa</h3>
    <input type="text" id="mensaje" placeholder="Escribe tu mensaje">
    <input type="text" id="clave" placeholder="Escribe tu clave">
    <button id="btnCifrar">Cifrar</button>
    <button id="btnDescifrar">Descifrar</button>

    <h3>Resultado</h3>
    <p id="resultado"></p>

    <h3>Procedimiento</h3>
    <div id="procedimiento" style="text-align:left; white-space:pre-line; background:#f9f9f9; padding:10px; border:1px solid #ccc;"></div>

    <button onclick="location.href='index.html'">Regresar al menú principal</button>
  </div>

  <script>
    const alfabeto = "ABCDEFGHIJKLMNÑOPQRSTUVWXYZ";

    function mostrarProcedimiento(pasos) {
      document.getElementById("procedimiento").innerText = pasos.join("\n");
    }

    function cifrar() {
      const mensaje = document.getElementById("mensaje").value.toUpperCase();
      const clave = document.getElementById("clave").value.toUpperCase();
      const resultado = document.getElementById("resultado");

      if (!clave) {
        resultado.innerText = "⚠️ Ingresa una clave válida.";
        return;
      }

      let textoFinal = "";
      let j = 0;
      let pasos = [];

      for (let i = 0; i < mensaje.length; i++) {
        const letra = mensaje[i];
        if (alfabeto.includes(letra)) {
          const posMensaje = alfabeto.indexOf(letra);
          const posClave = alfabeto.indexOf(clave[j % clave.length]);
          const nuevaPos = (posMensaje + posClave) % alfabeto.length;
          const letraCifrada = alfabeto[nuevaPos];
          textoFinal += letraCifrada;
          pasos.push(`Letra ${letra} (pos ${posMensaje}) + Clave ${clave[j % clave.length]} (pos ${posClave}) = ${letraCifrada} (pos ${nuevaPos})`);
          j++;
        } else {
          textoFinal += letra;
          pasos.push(`Carácter especial "${letra}" se conserva igual`);
        }
      }

      resultado.innerText = "🔒 Texto cifrado: " + textoFinal;
      mostrarProcedimiento(pasos);
    }

    function descifrar() {
      const mensaje = document.getElementById("mensaje").value.toUpperCase();
      const clave = document.getElementById("clave").value.toUpperCase();
      const resultado = document.getElementById("resultado");

      if (!clave) {
        resultado.innerText = "⚠️ Ingresa una clave válida.";
        return;
      }

      let textoFinal = "";
      let j = 0;
      let pasos = [];

      for (let i = 0; i < mensaje.length; i++) {
        const letra = mensaje[i];
        if (alfabeto.includes(letra)) {
          const posMensaje = alfabeto.indexOf(letra);
          const posClave = alfabeto.indexOf(clave[j % clave.length]);
          const nuevaPos = (posMensaje - posClave + alfabeto.length) % alfabeto.length;
          const letraDescifrada = alfabeto[nuevaPos];
          textoFinal += letraDescifrada;
          pasos.push(`Letra ${letra} (pos ${posMensaje}) - Clave ${clave[j % clave.length]} (pos ${posClave}) = ${letraDescifrada} (pos ${nuevaPos})`);
          j++;
        } else {
          textoFinal += letra;
          pasos.push(`Carácter especial "${letra}" se conserva igual`);
        }
      }

      resultado.innerText = "🔓 Texto descifrado: " + textoFinal;
      mostrarProcedimiento(pasos);
    }

    document.getElementById("btnCifrar").addEventListener("click", cifrar);
    document.getElementById("btnDescifrar").addEventListener("click", descifrar);
  </script>
</body>
</html>
